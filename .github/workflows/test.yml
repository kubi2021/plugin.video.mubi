name: Run Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Ruff lint
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install ruff
      run: pip install ruff==0.16.6  # pinned so a new ruff release cannot fail CI without a config bump

    - name: Ruff check (lint)
      run: ruff check repo/plugin_video_mubi backend

    - name: Ruff format (check only)
      run: ruff format --check repo/plugin_video_mubi backend

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    env:
      PYTHONPATH: ${{ github.workspace }}

    name: Test Python ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display Python version
      run: |
        python -c "import sys; print(f'Python {sys.version}')"
        python -c "import platform; print(f'Platform: {platform.platform()}')"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=repo/plugin_video_mubi --cov=backend --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80
      continue-on-error: false

    - name: Test Summary
      if: always()
      run: |
        echo "✅ Python ${{ matrix.python-version }} tests completed"
        echo "📊 Coverage validated (minimum 80%)"
        echo "🎉 All checks passed for Python ${{ matrix.python-version }}"
